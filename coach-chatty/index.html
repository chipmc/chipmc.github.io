<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#122923"><meta name="description" content="Your workout, one set at a time. Log, rest, and send your results to Coach Chatty."><title>Coach Chatty · Gym Log</title><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles.css?v=3"></head>
<body><header><div class="brand"><span class="mark">C<span>+</span></span><div>COACH CHATTY<small>YOUR GYM LOG</small></div></div><span id="connection" class="badge">Opening…</span></header>
<main><nav aria-label="Main navigation"><button data-tab="workout" aria-current="page">Workout</button><button data-tab="library">Library</button><button data-tab="history">History</button></nav><div id="notice" role="status" aria-live="polite"></div><section id="workout"></section><section id="library" hidden></section><section id="history" hidden></section></main>
<aside class="timerbar"><div><small>WORKOUT</small><strong id="elapsed">00:00</strong></div><div><small>REST</small><strong id="rest" role="timer">Ready</strong></div><button id="rest60">60s</button><button id="rest90">90s</button><button id="restStop" aria-label="Stop rest timer">×</button></aside>
<dialog id="resultDialog"><div class="dialoghead"><h2>Session saved.</h2><button id="closeResult" aria-label="Close results">×</button></div><p>Copy these results and paste them into your Coach Chatty conversation for your next workout.</p><textarea id="payload" readonly aria-label="Workout results for ChatGPT"></textarea><div class="actions"><button id="copyResult" class="primary">Copy for ChatGPT</button><button id="downloadResult">Download JSON</button></div><p id="copyStatus" role="status"></p></dialog><script src="app.js?v=3" defer></script></body></html>
